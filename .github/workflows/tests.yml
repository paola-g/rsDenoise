name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run compatibility unit tests
        run: python -m pytest -q

  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full runtime dependencies
        run: python -m pip install -e .
      - name: Smoke-test legacy import surface
        run: |
          python -c "import fmriprep_helpers, fmriprepciftify_helpers, HCP_helpers, rsDenoise"
      - name: Smoke-test shared-core wiring on synthetic fixtures
        run: python -m scripts.smoke_wiring
